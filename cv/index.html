<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#fafbff;

    background-image:
    linear-gradient(rgba(220,220,255,.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(220,220,255,.3) 1px, transparent 1px);

    background-size:70px 70px;

}

.container{

    width:700px;

    max-width:95%;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 20px 50px rgba(0,0,0,.08);

}

h1{

    color:#e27ca7;

    margin-bottom:10px;

    font-size:32px;

}

.subtitle{

    color:#777;

}

.cv-card{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 25px;

    border:1px solid #eee;

    border-radius:18px;

    margin-bottom:20px;

    transition:.3s;

}

.cv-card:hover{

    transform:translateY(-5px);

    box-shadow:0 10px 25px rgba(226,124,167,.18);

}

.left{

    display:flex;

    align-items:center;

    gap:18px;

}

.left i{

    font-size:42px;

    color:#e27ca7;

}

.left h3{

    font-size:20px;

    color:#333;

}

.left p{

    color:#888;

    font-size:14px;

}

.download{

    background:#e27ca7;

    color:white;

    text-decoration:none;

    padding:12px 24px;

    border-radius:12px;

    transition:.3s;

    font-weight:600;

}

.download:hover{

    background:#d05f90;

}

.back{

    display:inline-block;

    margin-top:20px;

    color:#777;

    text-decoration:none;

}

.back:hover{

    color:#e27ca7;

}

@media(max-width:700px){

.cv-card{

flex-direction:column;

gap:20px;

text-align:center;

}

.left{

flex-direction:column;

}

}
